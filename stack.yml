version: "3.8"

services:

  pozary-hajnowka:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pozary-hajnowka
    working_dir: /app
    command: tail -f /dev/null
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TZ=Europe/Warsaw
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.pozary-rano.schedule: "0 50 7 * * *"
      ofelia.job-exec.pozary-rano.command: python bot.py
      ofelia.job-exec.pozary-poludnie.schedule: "0 50 11 * * *"
      ofelia.job-exec.pozary-poludnie.command: python bot.py
    networks:
      - default
      - ofelia_net
    restart: unless-stopped

networks:
  default:
  ofelia_net:
    external: true
    name: viking-fitatu-integration_default
